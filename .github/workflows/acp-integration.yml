name: Manual ACP authentication integration

# Explicit runs only. No push, PR, or scheduled triggers.
on:
  workflow_dispatch:
    inputs:
      vendor_discovery:
        description: Offline adapter discovery and synthetic API-login rejection (no accounts or prompts)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: acp-authentication-integration
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Set disposable build locations
        run: echo "CARGO_HOME=$RUNNER_TEMP/buzz-cargo" >> "$GITHUB_ENV"
      - name: Check out plugin without stored Git credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: plugin
          persist-credentials: false
      - name: Check out exact upstream contribution base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: block/buzz
          ref: 781d39510cf23cfe224e8f521ae06a23377e06de
          path: buzz
          persist-credentials: false
      - name: Restore disposable compiled dependencies
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/buzz-cargo
            ${{ runner.temp }}/relay-target
            ${{ runner.temp }}/helper-target
          key: buzz-acp-auth-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('plugin/docs/upstream/acp-interactive-login.patch', 'plugin/docs/upstream/acp-permission-mode.patch', 'plugin/docs/upstream/ws-resource-limits.patch', 'plugin/docs/upstream/acp-key-isolation.patch', 'plugin/docs/upstream/acp-harness-replies.patch', 'plugin/docs/upstream/acp-deny-tool-requests.patch') }}
          restore-keys: |
            buzz-acp-auth-v1-${{ runner.os }}-${{ runner.arch }}-
            buzz-relay-v2-Linux-X64-781d39510cf23cfe224e8f521ae06a23377e06de-7271d12c3707c2c186f2a4f84f2d675dbb173a2484b0ba34be8b9d5575f10bec-acp
      - name: Install tested compiler and build prerequisites
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev protobuf-compiler
      - name: Apply contributions only to disposable upstream checkout
        working-directory: buzz
        run: |
          test "$(git rev-parse HEAD)" = 781d39510cf23cfe224e8f521ae06a23377e06de
          git diff --exit-code
          git apply --check ../plugin/docs/upstream/ws-resource-limits.patch
          git apply ../plugin/docs/upstream/ws-resource-limits.patch
          git apply --check ../plugin/docs/upstream/acp-permission-mode.patch
          git apply ../plugin/docs/upstream/acp-permission-mode.patch
          git apply --check ../plugin/docs/upstream/acp-interactive-login.patch
          git apply ../plugin/docs/upstream/acp-interactive-login.patch
          git apply --check ../plugin/docs/upstream/acp-key-isolation.patch
          git apply ../plugin/docs/upstream/acp-key-isolation.patch
          git apply --check ../plugin/docs/upstream/acp-harness-replies.patch
          git apply ../plugin/docs/upstream/acp-harness-replies.patch
          git apply --check ../plugin/docs/upstream/acp-deny-tool-requests.patch
          git apply ../plugin/docs/upstream/acp-deny-tool-requests.patch
      - name: Build complete patched upstream ACP crate
        id: build
        working-directory: buzz
        run: cargo +1.95.0 build --locked -p buzz-acp --target-dir "$RUNNER_TEMP/relay-target"
      - name: Compile upstream unit-test target and run descriptor checks
        working-directory: buzz
        run: |
          cargo +1.95.0 test --locked -p buzz-acp --lib terminal_auth::tests --target-dir "$RUNNER_TEMP/relay-target"
          cargo +1.95.0 test --locked -p buzz-acp --lib acp::tests::initialize_request_format --target-dir "$RUNNER_TEMP/relay-target" -- --exact
      - name: Test relay key input and runtime isolation
        working-directory: buzz
        run: |
          cargo +1.95.0 test --locked -p buzz-acp --lib key_input:: --target-dir "$RUNNER_TEMP/relay-target"
          BUZZ_AUTH_TAG=synthetic-parent-marker GIT_CONFIG_GLOBAL=/nonexistent-fixture cargo +1.95.0 test --locked -p buzz-acp --lib key_isolation_tests:: --target-dir "$RUNNER_TEMP/relay-target"
      - name: Test explicit rejection of ACP tool permission requests
        working-directory: buzz
        run: cargo +1.95.0 test --locked -p buzz-acp --lib deny_tool_policy --target-dir "$RUNNER_TEMP/relay-target"
      - name: Test bounded room reply capture, signing and HTTP delivery
        working-directory: buzz
        run: |
          cargo +1.95.0 test --locked -p buzz-acp --lib reply_capture:: --target-dir "$RUNNER_TEMP/relay-target"
          cargo +1.95.0 test --locked -p buzz-acp --lib acp::tests::room_reply_ --target-dir "$RUNNER_TEMP/relay-target"
          cargo +1.95.0 test --locked -p buzz-acp --lib room_reply:: --target-dir "$RUNNER_TEMP/relay-target"
          cargo +1.95.0 test --locked -p buzz-acp --lib room_reply_transport_tests:: --target-dir "$RUNNER_TEMP/relay-target"
      - name: Exercise actual key input without relay or agent startup
        working-directory: plugin
        run: python3 tests/acp_key_isolation_upstream.py --binary "$RUNNER_TEMP/relay-target/debug/buzz-acp" --output "$RUNNER_TEMP/acp-key-evidence.json"
      - name: Upload sanitized key input evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acp-key-isolation-evidence
          path: ${{ runner.temp }}/acp-key-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Exercise actual ACP client and command with fake stdio peers
        working-directory: plugin
        run: python3 tests/acp_terminal_upstream.py --binary "$RUNNER_TEMP/relay-target/debug/buzz-acp" --output "$RUNNER_TEMP/acp-auth-evidence.json"
      - name: Validate discovery probe boundaries
        working-directory: plugin
        run: |
          python3 -m unittest discover -s tests -p test_vendor_adapter_discovery.py -v
          python3 -m unittest discover -s tests -p test_codex_subscription_probe.py -v
      - name: Install exact Node runtime for optional vendor discovery
        if: inputs.vendor_discovery
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.23.3'
      - name: Install locked adapter artifacts without lifecycle scripts
        if: inputs.vendor_discovery
        working-directory: plugin
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, shutil, subprocess, tempfile
          with tempfile.TemporaryDirectory(prefix='buzz-npm-', dir=os.environ['RUNNER_TEMP']) as home:
              root=pathlib.Path(home)
              for name in ('user.npmrc','global.npmrc'): (root/name).touch()
              env={'HOME':home,'PATH':os.environ['PATH'],'LANG':'C.UTF-8'}
              subprocess.run([shutil.which('npm'),'ci','--ignore-scripts','--omit=dev','--no-audit','--no-fund',
                  '--userconfig='+str(root/'user.npmrc'),'--globalconfig='+str(root/'global.npmrc'),
                  '--cache='+str(root/'cache')], cwd='tests/vendor-adapters', env=env, check=True, timeout=300)
          PYCODE
      - name: Discover vendor auth methods without network or existing accounts
        if: inputs.vendor_discovery
        working-directory: plugin
        run: |
          probe_uid=$(id -u)
          probe_gid=$(id -g)
          probe_node=$(command -v node)
          outside_netns=$(readlink /proc/self/ns/net)
          sudo unshare --net --pid --fork --kill-child --mount-proc -- \
            /usr/bin/setpriv --reuid="$probe_uid" --regid="$probe_gid" --clear-groups --no-new-privs \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
            /usr/bin/env -i PATH="$(dirname "$probe_node"):/usr/bin:/bin" LANG=C.UTF-8 \
            /usr/bin/python3 tests/vendor_adapter_discovery.py \
            --binary "$RUNNER_TEMP/relay-target/debug/buzz-acp" \
            --packages "$GITHUB_WORKSPACE/plugin/tests/vendor-adapters" \
            --node "$probe_node" --outside-netns "$outside_netns" \
            --output "$RUNNER_TEMP/vendor-adapter-evidence.json"
      - name: Verify native Codex rejects synthetic API login under startup subscription policy
        if: inputs.vendor_discovery
        working-directory: plugin
        run: |
          probe_uid=$(id -u)
          probe_gid=$(id -g)
          probe_node=$(command -v node)
          outside_netns=$(readlink /proc/self/ns/net)
          sudo unshare --net --pid --fork --kill-child --mount-proc -- \
            /usr/bin/setpriv --reuid="$probe_uid" --regid="$probe_gid" --clear-groups --no-new-privs \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
            /usr/bin/env -i PATH="$(dirname "$probe_node"):/usr/bin:/bin" LANG=C.UTF-8 \
            /usr/bin/python3 tests/codex_subscription_probe.py \
            --packages "$GITHUB_WORKSPACE/plugin/tests/vendor-adapters" \
            --node "$probe_node" --outside-netns "$outside_netns" \
            --output "$RUNNER_TEMP/codex-subscription-evidence.json"
      - name: Upload sanitized subscription policy evidence
        if: always() && inputs.vendor_discovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-subscription-evidence
          path: ${{ runner.temp }}/codex-subscription-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload sanitized vendor discovery evidence
        if: always() && inputs.vendor_discovery
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vendor-adapter-evidence
          path: ${{ runner.temp }}/vendor-adapter-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload sanitized evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: acp-authentication-evidence
          path: ${{ runner.temp }}/acp-auth-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve successful compilation for follow-up tests
        if: always() && !cancelled() && steps.build.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ${{ runner.temp }}/buzz-cargo
            ${{ runner.temp }}/relay-target
            ${{ runner.temp }}/helper-target
          key: ${{ steps.cache.outputs.cache-primary-key }}
