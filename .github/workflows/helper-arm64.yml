name: Manual ARM64 helper preview

# Thin caller of the reusable helper build; the artifact keeps its historical
# name so existing docs and download commands still work.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: helper-arm64-preview
  cancel-in-progress: false

jobs:
  helper:
    permissions:
      contents: read
    uses: ./.github/workflows/helper-build.yml
    with:
      runner: ubuntu-24.04-arm
      arch: aarch64
      target: aarch64-unknown-linux-gnu
      artifact: helper-arm64-preview
