name: Validate plugin and helper

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out plugin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: omarchy-buzz
          persist-credentials: false
      - name: Check out tested Omarchy source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: omacom/omarchy
          ref: 7b336b1b0da722e7bb864a7136f91e784ef731bf
          path: omarchy
          persist-credentials: false
      - name: Validate manifest
        working-directory: omarchy-buzz
        env:
          OMARCHY_SOURCE: ${{ github.workspace }}/omarchy
        run: ./scripts/validate
  helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - name: Check out plugin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install tested Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.95.0 fmt --manifest-path helper/Cargo.toml --check
      - name: Test helper boundaries
        run: cargo +1.95.0 test --locked --manifest-path helper/Cargo.toml
      - name: Build helper
        run: cargo +1.95.0 build --locked --manifest-path helper/Cargo.toml
      - name: Test daemon and bridge without credentials
        run: python3 tests/helper_smoke.py helper/target/debug/omarchy-buzz
      - name: Test send scope fences without a relay
        run: python3 tests/helper_send_ipc.py helper/target/debug/omarchy-buzz
      - name: Test inherited socket idle reactivation
        run: python3 tests/helper_activation.py helper/target/debug/omarchy-buzz
      - name: Install isolated keyring test dependencies
        run: sudo apt-get update && sudo apt-get install -y dbus gnome-keyring
      - name: Test synthetic identity enrollment in a private keyring
        run: python3 tests/helper_keyring.py helper/target/debug/omarchy-buzz
