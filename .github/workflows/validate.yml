name: Validate plugin and helper

# Manual-only during development to avoid unsolicited workflow notifications.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out plugin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: omarchy-buzz
          persist-credentials: false
      - name: Check out tested Omarchy source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: omacom/omarchy
          ref: 7b336b1b0da722e7bb864a7136f91e784ef731bf
          path: omarchy
          persist-credentials: false
      - name: Test reversible shortcut and upstream pin tooling
        working-directory: omarchy-buzz
        run: |
          python3 tests/desktop_shortcut.py
          python3 tests/package_helper.py
          python3 tests/helper_install.py
          python3 tests/helper_notices.py
          python3 tests/pick_file.py
          python3 tests/relay_conformance_runner.py
          python3 tests/acp_fixture.py
          node tests/activity_observer.cjs
          node tests/room_activity.cjs
          python3 scripts/check-upstream --self-test
      - name: Validate manifest
        working-directory: omarchy-buzz
        env:
          OMARCHY_SOURCE: ${{ github.workspace }}/omarchy
        run: ./scripts/validate
  helper:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
      - name: Check out plugin
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install system D-Bus build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - name: Install tested Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +1.95.0 fmt --manifest-path helper/Cargo.toml --check
      - name: Test helper boundaries
        run: cargo +1.95.0 test --locked --manifest-path helper/Cargo.toml
      - name: Build helper
        run: cargo +1.95.0 build --locked --manifest-path helper/Cargo.toml
      - name: Test daemon and bridge without credentials
        run: python3 tests/helper_smoke.py helper/target/debug/omarchy-buzz
      - name: Test send scope fences without a relay
        run: python3 tests/helper_send_ipc.py helper/target/debug/omarchy-buzz
      - name: Test inherited socket idle reactivation
        run: python3 tests/helper_activation.py helper/target/debug/omarchy-buzz
      - name: Install isolated keyring test dependencies
        run: sudo apt-get update && sudo apt-get install -y dbus gnome-keyring
      - name: Test synthetic identity enrollment in a private keyring
        run: python3 tests/helper_keyring.py helper/target/debug/omarchy-buzz
  upstream-ws-proposal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out plugin contribution artifacts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: omarchy-buzz
          persist-credentials: false
      - name: Check out exact upstream patch base
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: block/buzz
          ref: 781d39510cf23cfe224e8f521ae06a23377e06de
          path: buzz
          persist-credentials: false
      - name: Stage isolated contribution without changing upstream
        working-directory: omarchy-buzz
        run: python3 scripts/prepare-ws-contribution --buzz-source ../buzz --output "$RUNNER_TEMP/buzz-ws-review"
      - name: Install tested toolchain
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Test proposed client limits against synthetic peers
        run: cargo +1.95.0 test --locked --manifest-path "$RUNNER_TEMP/buzz-ws-review/crates/buzz-ws-client/Cargo.toml"
      - name: Stage ACP authentication policy proposal
        working-directory: omarchy-buzz
        run: python3 scripts/prepare-acp-auth-contribution --buzz-source ../buzz --output "$RUNNER_TEMP/buzz-acp-auth-review"
      - name: Test exact pure ACP authentication policy functions
        run: cargo +1.95.0 test --locked --manifest-path "$RUNNER_TEMP/buzz-acp-auth-review/policy-test/Cargo.toml"
      - name: Stage ACP permission-mode proposal
        working-directory: omarchy-buzz
        run: python3 scripts/prepare-acp-permission-contribution --buzz-source ../buzz --output "$RUNNER_TEMP/buzz-acp-permission-review"
      - name: Test patched permission-mode guard and async setter
        run: cargo +1.95.0 test --locked --manifest-path "$RUNNER_TEMP/buzz-acp-permission-review/policy-test/Cargo.toml"
      - name: Stage interactive ACP login proposal
        working-directory: omarchy-buzz
        run: python3 scripts/prepare-acp-terminal-contribution --buzz-source ../buzz --output "$RUNNER_TEMP/buzz-acp-terminal-review"
      - name: Test terminal descriptor validation and build auth fixture
        run: |
          cargo +1.95.0 test --locked --manifest-path "$RUNNER_TEMP/buzz-acp-terminal-review/policy-test/Cargo.toml"
          cargo +1.95.0 build --locked --manifest-path "$RUNNER_TEMP/buzz-acp-terminal-review/policy-test/Cargo.toml"
      - name: Test terminal login with disposable pseudo-terminals
        working-directory: omarchy-buzz
        run: python3 tests/acp_terminal.py "$RUNNER_TEMP/buzz-acp-terminal-review/policy-test/target/debug/buzz-acp-terminal-contribution"
