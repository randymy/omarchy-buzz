name: Helper build (reusable)

# Called by helper-arm64.yml, helper-x86_64.yml and release.yml. Builds and
# tests the helper natively on one architecture, inventories its notices,
# packages it and uploads the package directory as one artifact. It never
# installs, releases or publishes anything.
on:
  workflow_call:
    inputs:
      runner:
        description: Native runner label (ubuntu-24.04-arm or ubuntu-24.04)
        required: true
        type: string
      arch:
        description: Expected `uname -m` (aarch64 or x86_64)
        required: true
        type: string
      target:
        description: Rust target triple for the notices inventory
        required: true
        type: string
      artifact:
        description: Name of the uploaded artifact
        required: true
        type: string

permissions:
  contents: read

jobs:
  helper:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      HELPER_ARCH: ${{ inputs.arch }}
      HELPER_TARGET: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify native architecture and install build prerequisites
        run: |
          case "$HELPER_ARCH" in aarch64|x86_64) ;; *) echo "unsupported arch: $HELPER_ARCH" >&2; exit 1 ;; esac
          test "$HELPER_TARGET" = "$HELPER_ARCH-unknown-linux-gnu"
          test "$(uname -m)" = "$HELPER_ARCH"
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev dbus gnome-keyring
      - id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            helper/target
          key: buzz-helper-${{ inputs.arch == 'aarch64' && 'arm64' || inputs.arch }}-v1-${{ hashFiles('helper/Cargo.lock') }}
          restore-keys: buzz-helper-${{ inputs.arch == 'aarch64' && 'arm64' || inputs.arch }}-v1-
      - name: Check formatting and native helper tests
        id: build
        run: |
          cargo +1.95.0 fmt --manifest-path helper/Cargo.toml --check
          cargo +1.95.0 test --locked --release --manifest-path helper/Cargo.toml
          cargo +1.95.0 build --locked --release --manifest-path helper/Cargo.toml
      - name: Check actual helper IPC without credentials
        run: |
          python3 tests/helper_smoke.py helper/target/release/omarchy-buzz
          python3 tests/helper_send_ipc.py helper/target/release/omarchy-buzz
          python3 tests/helper_activation.py helper/target/release/omarchy-buzz
      - name: Verify system D-Bus linkage and private Secret Service
        run: |
          python3 - <<'PYCODE'
          import subprocess
          binary = 'helper/target/release/omarchy-buzz'
          dynamic = subprocess.check_output(['readelf', '-d', binary], text=True)
          assert '[libdbus-1.so.3]' in dynamic, 'expected system D-Bus linkage'
          PYCODE
          command -v dbus-run-session
          command -v gnome-keyring-daemon
          python3 tests/helper_keyring.py helper/target/release/omarchy-buzz
      - name: Inventory locked helper dependency notices for the target
        run: |
          cargo +1.95.0 metadata --offline --locked --format-version 1 \
            --filter-platform "$HELPER_TARGET" \
            --manifest-path helper/Cargo.toml > "$RUNNER_TEMP/helper-cargo-metadata.json"
          python3 scripts/helper-notices "$RUNNER_TEMP/helper-cargo-metadata.json" \
            --lock helper/Cargo.lock --target "$HELPER_TARGET" \
            --supplemental docs/evidence/notices \
            --output "$RUNNER_TEMP/helper-notices"
          python3 tests/helper_notices.py
      - name: Prepare development artifact with exact provenance
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform,re,shutil,subprocess,tomllib
          root=pathlib.Path.cwd()
          architecture=os.environ['HELPER_ARCH']
          assert platform.machine()==architecture
          binary=root/'helper/target/release/omarchy-buzz'
          metadata=json.loads(subprocess.check_output([str(binary),'--version'],text=True))
          cargo=tomllib.loads((root/'helper/Cargo.toml').read_text())
          manifest=json.loads((root/'manifest.json').read_text())
          assert metadata['helperVersion']==cargo['package']['version']==manifest['version']
          assert metadata['backendRevision']==cargo['dependencies']['buzz-sdk']['rev']
          destination=root/'dist'
          destination.mkdir()
          shutil.copy2(binary,destination/'omarchy-buzz')
          report={'sourceRevision':os.environ['GITHUB_SHA'],'runId':os.environ['GITHUB_RUN_ID'],
                  'architecture':architecture,'developmentPreview':True,
                  'sha256':hashlib.sha256(binary.read_bytes()).hexdigest(),'metadata':metadata,
                  'dynamicLibraries':re.findall(r'Shared library: \[([^\]]+)\]',subprocess.check_output(['readelf','-d',str(binary)],text=True))}
          (destination/'build.json').write_text(json.dumps(report,indent=2)+'\n')
          shutil.copy2(root/'LICENSE',destination/'LICENSE')
          PY
          python3 scripts/package-helper helper/target/release/omarchy-buzz dist \
            --notices "$RUNNER_TEMP/helper-notices"
          cp -a "$RUNNER_TEMP/helper-notices" dist/notices
      - name: Upload package directory; no release or install
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.artifact }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve native compilation for fixture corrections
        if: always() && !cancelled() && steps.build.outcome == 'success' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            helper/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
