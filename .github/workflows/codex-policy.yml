name: Manual Codex subscription policy proposal

# Manual runs only; the user resumed focused remote validation on 2026-09-28.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-subscription-policy
  cancel-in-progress: false

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: plugin
          persist-credentials: false
      - name: Check out exact upstream adapter source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: agentclientprotocol/codex-acp
          ref: 2eebebc35441e03cd466003b40a75953b221b886
          path: adapter
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Apply proposal only in disposable checkout
        working-directory: adapter
        run: |
          git apply --check ../plugin/docs/upstream/codex-subscription-policy.patch
          git apply ../plugin/docs/upstream/codex-subscription-policy.patch
      - name: Install locked development dependencies without lifecycle scripts
        working-directory: adapter
        run: |
          python3 - <<'PY'
          import os,pathlib,shutil,subprocess,tempfile
          with tempfile.TemporaryDirectory(prefix='codex-policy-npm-',dir=os.environ['RUNNER_TEMP']) as home:
              root=pathlib.Path(home)
              for name in ('user.npmrc','global.npmrc'): (root/name).touch()
              env={'HOME':home,'PATH':os.environ['PATH'],'LANG':'C.UTF-8'}
              subprocess.run([shutil.which('npm'),'ci','--ignore-scripts','--no-audit','--no-fund',
                  '--userconfig='+str(root/'user.npmrc'),'--globalconfig='+str(root/'global.npmrc'),
                  '--cache='+str(root/'cache')],env=env,check=True,timeout=300)
          PY
      - name: Typecheck build and exercise policy without provider access
        working-directory: adapter
        run: |
          probe_uid=$(id -u)
          probe_gid=$(id -g)
          probe_node=$(command -v node)
          probe_home=$(mktemp -d "$RUNNER_TEMP/codex-policy-home.XXXXXXXX")
          sudo unshare --net --pid --fork --kill-child --mount-proc -- \
            /usr/bin/setpriv --reuid="$probe_uid" --regid="$probe_gid" --clear-groups --no-new-privs \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
            /usr/bin/env -i HOME="$probe_home" PATH="$(dirname "$probe_node"):/usr/bin:/bin" LANG=C.UTF-8 \
            /bin/bash -euc '
              node ../plugin/tests/codex_policy_smoke.mjs "$PWD"
              npm run typecheck
              npm run build
              ./node_modules/.bin/vitest run --no-file-parallelism --retry=0 src/__tests__/SubscriptionPolicy.test.ts src/__tests__/CodexACPAgent/providers.test.ts src/__tests__/CodexACPAgent/auth-status.test.ts
            '
