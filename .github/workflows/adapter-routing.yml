name: Manual adapter routing conformance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adapter-routing-conformance
  cancel-in-progress: false

jobs:
  routing:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.3'
      - name: Check bounded synthetic fixtures
        run: |
          python3 -m unittest discover -s tests -p test_codex_routing_probe.py -v
          python3 -m unittest discover -s tests -p test_claude_subscription_probe.py -v
      - name: Install exact adapter artifacts without lifecycle scripts
        id: install
        run: |
          python3 - <<'PY'
          import os,pathlib,shutil,subprocess,tempfile
          with tempfile.TemporaryDirectory(prefix='buzz-routing-npm-',dir=os.environ['RUNNER_TEMP']) as home:
              root=pathlib.Path(home)
              for name in ('user.npmrc','global.npmrc'): (root/name).touch()
              env={'HOME':home,'PATH':os.environ['PATH'],'LANG':'C.UTF-8'}
              subprocess.run([shutil.which('npm'),'ci','--ignore-scripts','--omit=dev','--no-audit','--no-fund',
                  '--userconfig='+str(root/'user.npmrc'),'--globalconfig='+str(root/'global.npmrc'),
                  '--cache='+str(root/'cache')],cwd='tests/vendor-adapters',env=env,check=True,timeout=300)
          PY
      - name: Characterize routing with a scripted native peer and no provider access
        run: |
          probe_uid=$(id -u)
          probe_gid=$(id -g)
          probe_node=$(command -v node)
          outside_netns=$(readlink /proc/self/ns/net)
          sudo unshare --net --pid --fork --kill-child --mount-proc -- \
            /usr/bin/setpriv --reuid="$probe_uid" --regid="$probe_gid" --clear-groups --no-new-privs \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
            /usr/bin/env -i PATH="$(dirname "$probe_node"):/usr/bin:/bin" LANG=C.UTF-8 \
            /usr/bin/python3 tests/codex_routing_probe.py \
            --packages "$GITHUB_WORKSPACE/tests/vendor-adapters" \
            --node "$probe_node" --outside-netns "$outside_netns" \
            --output "$RUNNER_TEMP/codex-routing-evidence.json"
      - name: Characterize native Claude login policy without a real credential
        if: always() && !cancelled() && steps.install.outcome == 'success'
        run: |
          probe_uid=$(id -u)
          probe_gid=$(id -g)
          probe_node=$(command -v node)
          outside_netns=$(readlink /proc/self/ns/net)
          sudo unshare --net --pid --fork --kill-child --mount-proc -- \
            /usr/bin/setpriv --reuid="$probe_uid" --regid="$probe_gid" --clear-groups --no-new-privs \
            --bounding-set=-all --inh-caps=-all --ambient-caps=-all \
            /usr/bin/env -i PATH="$(dirname "$probe_node"):/usr/bin:/bin" LANG=C.UTF-8 \
            /usr/bin/python3 tests/claude_subscription_probe.py \
            --packages "$GITHUB_WORKSPACE/tests/vendor-adapters" \
            --node "$probe_node" --outside-netns "$outside_netns" \
            --output "$RUNNER_TEMP/claude-subscription-evidence.json"
      - name: Upload only sanitized routing evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-routing-evidence
          path: ${{ runner.temp }}/codex-routing-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload only sanitized Claude evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: claude-subscription-evidence
          path: ${{ runner.temp }}/claude-subscription-evidence.json
          if-no-files-found: warn
          retention-days: 7
