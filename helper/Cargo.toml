[package]
name = "omarchy-buzz"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"

[dependencies]
buzz-ws-client = { git = "https://github.com/block/buzz", rev = "781d39510cf23cfe224e8f521ae06a23377e06de" }
nostr = { version = "0.44", features = ["nip44", "nip98"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "io-std", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
rpassword = "7"
zeroize = "1"
listenfd = "1"
rustix = { version = "1", features = ["process"] }
